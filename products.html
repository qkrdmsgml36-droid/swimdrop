
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>졸린 공식몰 상품 | SWIM DROP</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,
  "Noto Sans KR",sans-serif;
  background:#f4f8fa;
  color:#142c3b;
}
header{
  background:#102b40;
  color:white;
  padding:24px 18px;
}
.wrap{max-width:950px;margin:auto}
.back{color:#a7d8df;text-decoration:none;font-size:13px}
h1{font-size:25px;margin:16px 0 8px}
header p{color:#c3d6df;font-size:13px;line-height:1.6}
main{padding:20px 14px 50px}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
input,select{
  padding:12px;border:1px solid #d8e3e8;
  border-radius:10px;background:white;min-width:0;
}
input{flex:1;width:100%}
.notice{font-size:12px;color:#657d88;line-height:1.7;margin:12px 0 20px}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 14px #12354c0c;
}
.photo{
  aspect-ratio:3/4;
  background:#e7f1f4;
  display:flex;align-items:center;justify-content:center;
}
.photo img{width:100%;height:100%;object-fit:contain}
.info{padding:12px}
.brand{font-size:11px;color:#39808b;font-weight:800}
.name{font-size:13px;font-weight:700;line-height:1.5;margin:7px 0;min-height:40px}
.price{font-size:16px;font-weight:800}
.status{font-size:11px;color:#738792;margin-top:5px}
.btn{
  display:block;text-align:center;text-decoration:none;
  background:#102b40;color:white;
  padding:11px 8px;border-radius:10px;
  font-size:12px;font-weight:750;margin-top:12px;
}
.empty{text-align:center;padding:50px 10px;color:#738792}
footer{text-align:center;color:#80949f;font-size:11px;padding:20px}
@media(min-width:650px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(min-width:900px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="back" href="./index.html">← SWIM DROP 홈으로</a>
    <h1>🏊 JOLYN COLLECTION</h1>
    <p>졸린 글로벌 공식몰 상품을 한눈에 확인하세요.<br>
    상품 정보는 주기적으로 업데이트됩니다.</p>
  </div>
</header>
<main class="wrap">
  <div class="toolbar">
    <input id="search" type="search" placeholder="상품명 검색">
    <select id="sort" aria-label="정렬">
      <option value="recent">최근 등록순</option>
      <option value="low">낮은 가격순</option>
      <option value="high">높은 가격순</option>
    </select>
  </div>
  <div class="notice">
    가격은 미국 공식몰 기준 USD입니다. 배송비·세금·환율에 따라
    실제 결제 금액이 달라질 수 있습니다.<br>
    상품 등록일은 실제 출시일과 다를 수 있습니다.
    재고와 가격은 구매 전 공식몰에서 확인해 주세요.
    <div id="updated"></div>
  </div>
  <div id="count"></div>
  <div class="grid" id="products">
    <div class="empty">상품 정보를 불러오는 중...</div>
  </div>
</main>
<footer>SWIM DROP · 공식 브랜드와 제휴 관계 없음</footer>
<script>
let allProducts=[];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;',
  '"':'&quot;',"'":'&#39;'
}[c]));

function render(){
  const keyword=document.getElementById('search').value.toLowerCase();
  const sort=document.getElementById('sort').value;

  let list=allProducts.filter(p=>
    String(p.name||'').toLowerCase().includes(keyword)
  );

  if(sort==='low')list.sort((a,b)=>Number(a.price)-Number(b.price));
  if(sort==='high')list.sort((a,b)=>Number(b.price)-Number(a.price));

  document.getElementById('count').textContent=
    `상품 ${list.length}개`;

  document.getElementById('products').innerHTML=list.length
    ?list.map(p=>{
      const url=String(p.url||'');
      const safeUrl=url.startsWith('https://jolyn.com/products/')
        ?esc(url):'https://jolyn.com/';

      const image=String(p.image||'');
      const safeImage=/^https:\/\/[^ ]+$/i.test(image)
        ?esc(image):'';

      const price=Number(p.price);
      const priceText=Number.isFinite(price)&&p.price!==''
        ?`$${price.toFixed(2)}`:'가격 확인';

      return `<article class="card">
        <div class="photo">
          ${safeImage
            ?`<img src="${safeImage}" alt="${esc(p.name)}" loading="lazy">`
            :'🩱'}
        </div>
        <div class="info">
          <div class="brand">JOLYN</div>
          <div class="name">${esc(p.name)}</div>
          <div class="price">${priceText}</div>
          <div class="status">${p.available?'판매 가능 표시':'재고 확인 필요'}</div>
          <a class="btn" href="${safeUrl}"
             target="_blank" rel="noopener noreferrer">
             공식몰에서 보기 ↗
          </a>
        </div>
      </article>`;
    }).join('')
    :'<div class="empty">검색 결과가 없어요.</div>';
}

async function loadProducts(){
  try{
    const response=await fetch('./data/products.json',{
      cache:'no-store'
    });

    if(!response.ok)throw new Error('상품 파일을 찾을 수 없습니다.');

    const data=await response.json();
    if(!Array.isArray(data.products))throw new Error('상품 형식 오류');

    allProducts=data.products;
    if(data.updatedAt){
      document.getElementById('updated').textContent=
        '데이터 갱신: '+new Date(data.updatedAt).toLocaleString('ko-KR');
    }
    render();
  }catch(error){
    document.getElementById('products').innerHTML=
      '<div class="empty">상품을 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.</div>';
    console.error(error);
  }
}

document.getElementById('search').addEventListener('input',render);
document.getElementById('sort').addEventListener('change',render);
loadProducts();
</script>
</body>
</html>
